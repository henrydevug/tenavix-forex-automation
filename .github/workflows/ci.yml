name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  dart:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tenavix
          POSTGRES_PASSWORD: tenavix_ci_secret
          POSTGRES_DB: tenavix
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: tenavix_server
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
      - run: dart test test/unit test/security
      - name: Migrate and integration tests
        env:
          TENAVIX_DB_HOST: localhost
          TENAVIX_DB_PORT: 5432
          TENAVIX_DB_NAME: tenavix
          TENAVIX_DB_USER: tenavix
          TENAVIX_DB_PASSWORD: tenavix_ci_secret
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=tenavix_ci_secret psql -h localhost -U tenavix -d tenavix -f migrations/001_initial_schema.sql
          dart test test/integration
  frontend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JS smoke
        working-directory: tenavix_web
        run: node assets/js/api.test.mjs
